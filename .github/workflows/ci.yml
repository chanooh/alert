name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alert-release.jks"
          chmod 600 "$RUNNER_TEMP/alert-release.jks"
      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/alert-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: alert-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package KernelSU module
        run: |
          cd root/alert-guardian
          chmod 0755 service.sh action.sh
          zip -r ../../alert-guardian-kernelsu.zip module.prop skip_mount service.sh action.sh README.md
      - name: Upload KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: alert-guardian-kernelsu
          path: alert-guardian-kernelsu.zip
          if-no-files-found: error
