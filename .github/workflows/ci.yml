name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK command-line tools
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run Android unit tests
        run: |
          set +e
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-unit-test.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failure=$(awk '/^\* What went wrong:/{capture=1; next} capture && NF {print; exit} /^e: | error:/{print; exit}' "$RUNNER_TEMP/android-unit-test.log" || true)
            echo "::error title=Android unit-test failure::${failure:-See the Gradle log for details}"
            exit "$status"
          fi
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alert-release.jks"
          chmod 600 "$RUNNER_TEMP/alert-release.jks"
      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/alert-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: alert-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK for 32-bit daemon build
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Test Root MQTT daemon source
        working-directory: root/alert-guardian/daemon
        run: go test ./...
      - name: Cross-compile Root MQTT daemon
        working-directory: root/alert-guardian/daemon
        run: |
          mkdir -p ../bin/arm64-v8a ../bin/armeabi-v7a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../bin/arm64-v8a/alert-root-mqtt .
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_SDK_DIR"
          NDK="$ANDROID_SDK_DIR/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang" \
            CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags='-s -w' -o ../bin/armeabi-v7a/alert-root-mqtt .
          test -s ../bin/arm64-v8a/alert-root-mqtt
          test -s ../bin/armeabi-v7a/alert-root-mqtt
      - name: Package KernelSU module
        run: |
          cd root/alert-guardian
          chmod 0755 service.sh action.sh lib.sh status.sh restart.sh bin/arm64-v8a/alert-root-mqtt bin/armeabi-v7a/alert-root-mqtt
          zip -r ../../alert-guardian-kernelsu.zip module.prop skip_mount service.sh action.sh lib.sh status.sh restart.sh webroot README.md bin
      - name: Upload KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: alert-guardian-kernelsu
          path: alert-guardian-kernelsu.zip
          if-no-files-found: error
